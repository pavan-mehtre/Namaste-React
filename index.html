<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>React via ESM</title>

  <!-- Define package nicknames and their CDN locations -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh",
        "react-dom/client": "https://esm.sh"
      }
    }
  </script>
</head>
<body>

  <div id="root"></div>

  <script type="importmap">
    {
        "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react-dom/": "https://esm.sh/react-dom@19.2.0/"
        }
    }
    </script>
    <script type="module" crossorigin>
    import React from "react"; // → https://esm.sh/react@19.2.0
    import { render } from "react-dom/client"; // → https://esm.sh/react-dom@19.2.0/client
    </script>

</body>
</html>
